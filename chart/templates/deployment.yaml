apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "personal-site.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "personal-site.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "personal-site.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "personal-site.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: website
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.secrets.enabled }}
          env:
            - name: PGH_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "personal-site.fullname" . }}-secrets
                  key: database-url
          {{- end }}
          # travel section: optional until chart/templates/sealed-secret-b2.yaml
          # is sealed+applied; without it /travel just shows the empty state
          envFrom:
            - secretRef:
                name: personal-site-b2
                optional: true
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
